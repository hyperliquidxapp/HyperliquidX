name: Publish public Release

on:
  push:
    branches: [main]
    paths: ['releases/**']
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to publish (empty retries all published versions)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: public-releases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test public release validation
        run: node --test scripts/public-release.test.mjs
      - name: Publish verified DMG and SHA-256 without application source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/public-release.mjs
