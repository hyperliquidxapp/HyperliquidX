      <stop offset=".56" stop-color="#111315" />
      <stop offset="1" stop-color="#182b25" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#97fce3" />
      <stop offset="1" stop-color="#97fce3" />
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#c2f2df" stroke-opacity=".035" />
    </pattern>
  </defs>
  <rect width="1600" height="480" rx="24" fill="url(#background)" />
  <rect width="1600" height="480" rx="24" fill="url(#grid)" />
  <g fill="none" stroke="#81baa3" stroke-width="2" opacity=".13">
    <path d="M0 379L82 351L145 365L213 319L275 344L338 275L405 301L470 242" />
    <path d="M1130 280L1198 306L1264 239L1334 259L1400 182L1470 206L1538 130L1600 155" />
