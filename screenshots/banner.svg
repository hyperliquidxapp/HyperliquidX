<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">HyperliquidX — Best-in-class Hyperliquid workspace built for traders. Fast, modern, and delightful.</title>
  <desc id="desc">Mint waveform icon and HyperliquidX wordmark with the slogan: Best-in-class Hyperliquid workspace built for traders. Fast, modern, and delightful. Dark background with a subtle market-chart motif.</desc>
  <defs>
